<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
<title id="title">Samuel Crowe</title><desc id="desc">Ilustração estilizada de Samuel Crowe, investigador e rastreador de pistas.</desc>
<style>
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes gesture{0%,100%{transform:rotate(0deg)}45%{transform:rotate(7deg)}70%{transform:rotate(-3deg)}}
@keyframes nod{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-2deg)}}
.person{transform-box:fill-box;transform-origin:center bottom;animation:breathe 3.5s ease-in-out infinite}
.gesture{transform-box:fill-box;transform-origin:20% 20%;animation:gesture 3s ease-in-out infinite}
.head{transform-box:fill-box;transform-origin:center bottom;animation:nod 4.8s ease-in-out infinite}
</style>
<g class="person">
<ellipse cx="180" cy="493" rx="118" ry="15" fill="#050505" opacity=".35"/>
<path d="M83 489c5-93 20-171 59-201h76c39 30 54 108 59 201z" fill="#26302c" stroke="#929b95" stroke-width="2"/>
<path d="M143 292h74l-13 78h-48z" fill="#b7a57c"/>
<path d="M153 292l27 38 27-38 10 76h-74z" fill="#e7e0d2"/>
<path d="M157 273h46v37c-10 13-36 13-46 0z" fill="#b9795f"/>
<g class="head">
<path d="M128 153c0-48 24-79 52-79s52 31 52 79v62c0 40-25 65-52 65s-52-25-52-65z" fill="#b97d62" stroke="#35251f" stroke-width="2"/>
<path d="M126 153c-5-54 20-88 57-88 36 0 57 29 51 78-11-16-28-25-48-27-22-1-43 12-60 37z" fill="#24231f"/>
<path d="M132 113c14-28 36-42 66-36 15 3 27 11 34 23-19-4-36-5-51-1-17 4-33 10-49 14z" fill="#302f29"/>
<circle cx="160" cy="172" r="4" fill="#1d1715"/><circle cx="200" cy="172" r="4" fill="#1d1715"/>
<path d="M169 207c7 4 15 4 22 0" fill="none" stroke="#663d34" stroke-width="3" stroke-linecap="round"/>
<path d="M146 157c9-6 18-6 27-2M188 155c9-4 18-3 26 3" fill="none" stroke="#29231f" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- left gesturing arm -->
<g class="gesture">
<path d="M104 318c-31 24-49 56-57 91-4 18 4 31 18 28 20-5 24-31 36-58l32-39z" fill="#26302c" stroke="#929b95" stroke-width="2"/>
<path d="M47 416c-8 9-18 13-28 10" fill="none" stroke="#b97d62" stroke-width="11" stroke-linecap="round"/>
</g>
<path d="M256 318c27 25 43 57 48 95 3 18-7 28-20 23-18-7-21-34-30-61l-28-39z" fill="#26302c" stroke="#929b95" stroke-width="2"/>
<path d="M69 493h-22v-116M291 493h22v-116" stroke="#343c38" stroke-width="8" opacity=".8"/>
</g>
</svg>