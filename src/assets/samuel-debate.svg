@keyframes hand{0%,100%{transform:rotate(0deg) translateY(0)}48%{transform:rotate(7deg) translateY(-5px)}70%{transform:rotate(-2deg)}}
.person{transform-box:fill-box;transform-origin:center bottom;animation:breath 4.1s ease-in-out infinite}
.head{transform-box:fill-box;transform-origin:50% 80%;animation:head 5.9s ease-in-out infinite}
.hand{transform-box:fill-box;transform-origin:15% 20%;animation:hand 3.4s ease-in-out infinite}
</style>
